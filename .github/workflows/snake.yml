name Generate Contribution Snake

on
  schedule
    # Runs every 24 hours
    - cron 0 0   
  workflow_dispatch
  push
    branches
      - main

jobs
  generate
    permissions
      contents write
    runs-on ubuntu-latest
    timeout-minutes 5

    steps
      - name Generate github-contribution-grid-snake.svg
        uses Platanesnksvg-only@v3
        with
          github_user_name ${{ github.repository_owner }}
          outputs 
            distgithub-contribution-grid-snake.svg
            distgithub-contribution-grid-snake-dark.svgpalette=github-dark

      - name Push snake SVGs to output branch
        uses crazy-maxghaction-github-pages@v3.1.0
        with
          target_branch output
          build_dir dist
        env
          GITHUB_TOKEN ${{ secrets.GITHUB_TOKEN }}
